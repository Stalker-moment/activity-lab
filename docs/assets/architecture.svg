<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 460" role="img" aria-labelledby="title desc"><title id="title">Activity Lab architecture</title><desc id="desc">Adaptive browser frames to bounded FastAPI, then ANN or pretrained hybrid and output.</desc><rect width="1300" height="460" rx="18" fill="#0b1018"/><style>text{font-family:Arial,sans-serif}</style><text x="35" y="36" fill="#f4f6ff" font-size="19" font-weight="bold">ACTIVITY LAB / SYSTEM OVERVIEW</text><text x="35" y="62" fill="#8797af" font-size="12">Two approaches. One testing studio. Explicit limits.</text><g fill="none" stroke="#42536d" stroke-width="2"><path d="M240 195H285M490 195H510V85H535M510 195V320H535M755 320H800M755 85H1045V195H1065M1020 320H1045V195"/></g><rect x="35" y="140" width="205" height="110" rx="10" fill="#141e2d" stroke="#73e9d3" stroke-opacity=".5"/><text x="50" y="165" fill="#73e9d3" font-size="10" letter-spacing="1">01 / BROWSER</text><text x="50" y="192" fill="#f0f4fc" font-size="16" font-weight="bold">Next.js + webcam</text><text x="50" y="218" fill="#92a3ba" font-size="11">Adaptive frame payload</text><rect x="285" y="140" width="205" height="110" rx="10" fill="#141e2d" stroke="#87d9ff" stroke-opacity=".5"/><text x="300" y="165" fill="#87d9ff" font-size="10" letter-spacing="1">02 / ADMISSION</text><text x="300" y="192" fill="#f0f4fc" font-size="16" font-weight="bold">FastAPI gateway</text><text x="300" y="218" fill="#92a3ba" font-size="11">6 MB limit · bounded jobs</text><rect x="535" y="35" width="220" height="100" rx="10" fill="#141e2d" stroke="#b39aff" stroke-opacity=".5"/><text x="550" y="60" fill="#b39aff" font-size="10" letter-spacing="1">03 / TRAINED</text><text x="550" y="87" fill="#f0f4fc" font-size="16" font-weight="bold">MobileNetV2 + ANN</text><text x="550" y="113" fill="#92a3ba" font-size="11">6 aktivitas KTH</text><rect x="535" y="270" width="220" height="100" rx="10" fill="#141e2d" stroke="#73e9d3" stroke-opacity=".5"/><text x="550" y="295" fill="#73e9d3" font-size="10" letter-spacing="1">03 / PRETRAINED</text><text x="550" y="322" fill="#f0f4fc" font-size="16" font-weight="bold">YOLO + MediaPipe</text><text x="550" y="348" fill="#92a3ba" font-size="11">Object · pose · face · hand</text><rect x="800" y="270" width="220" height="100" rx="10" fill="#141e2d" stroke="#ffba79" stroke-opacity=".5"/><text x="815" y="295" fill="#ffba79" font-size="10" letter-spacing="1">04 / VIDEO</text><text x="815" y="322" fill="#f0f4fc" font-size="16" font-weight="bold">X-CLIP + text cache</text><text x="815" y="348" fill="#92a3ba" font-size="11">32+ action candidates</text><rect x="1065" y="140" width="195" height="110" rx="10" fill="#141e2d" stroke="#87d9ff" stroke-opacity=".5"/><text x="1080" y="165" fill="#87d9ff" font-size="10" letter-spacing="1">05 / OUTPUT</text><text x="1080" y="192" fill="#f0f4fc" font-size="16" font-weight="bold">Canvas + JSON</text><text x="1080" y="218" fill="#92a3ba" font-size="11">Overlay · scores · history</text><text x="35" y="420" fill="#7d8da5" font-size="12">Optional temporal indicators: prolonged eye closure / open mouth + potential fall. Age estimation unavailable.</text></svg>