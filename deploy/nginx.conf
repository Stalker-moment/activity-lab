server {
    listen 80;
    server_tokens off;
    client_max_body_size 6m;
    location /api/ {
        proxy_pass http://backend:8765/;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
